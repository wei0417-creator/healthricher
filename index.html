  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@600;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 40%, #eff6ff 100%);
      overflow-x: hidden;
    }

    /* 3D Interactive Dice */
    .dice-scene {
      width: 86px;
      height: 86px;
      perspective: 600px;
    }
    .dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }
    .dice-face {
      position: absolute;
      width: 86px;
      height: 86px;
      background: #ffffff;
      border: 4px solid #059669;
      border-radius: 18px;
      display: grid;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.18);
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
    }
    .pip {
      width: 15px;
      height: 15px;
      background-color: #1e293b;
      border-radius: 50%;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }
    .pip-red {
      background-color: #dc2626 !important;
      width: 26px;
      height: 26px;
    }

    /* 6x5 Board Grid Layout */
    .board-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(105px, 1fr));
      gap: 10px;
    }

    /* Active landing tile highlight */
    .tile-highlight {
      animation: tilePulse 1.3s infinite alternate ease-in-out;
      border-color: #f59e0b !important;
      background-color: #fef3c7 !important;
      transform: scale(1.03);
      z-index: 10;
    }
    @keyframes tilePulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      100% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
    }

    /* Floating token piece */
    .token-floating {
      animation: tokenHop 1.1s ease-in-out infinite alternate;
    }
    @keyframes tokenHop {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-5px) scale(1.1); }
    }
  </style>
</head>

  <script>
    // Pure Web Audio API Synthesizer (No external sound files required)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainLevel = 0.15) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn('Audio play error:', e);
      }
    }

    function playDiceTick() {
      playTone(320 + Math.random() * 260, 0.06, 'triangle', 0.12);
    }

    function playHopStep(stepIdx) {
      const baseFreq = 420 + (stepIdx * 45);
      playTone(baseFreq, 0.12, 'sine', 0.18);
    }

    function playSuccessChime() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            playTone(freq, 0.35, 'triangle', 0.2);
          }, idx * 110);
        });
      } catch (e) {}
    }

    function playCheerFanfare() {
      if (!soundEnabled) return;
      try {
        initAudio();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => playTone(freq, 0.28, 'sine', 0.22), idx * 100);
        });
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const soundIcon = document.getElementById('soundIcon');
      const soundText = document.getElementById('soundText');
      if (soundEnabled) {
        soundIcon.innerText = '🔊';
        soundText.innerText = '音效開';
        playTone(600, 0.15);
      } else {
        soundIcon.innerText = '🔇';
        soundText.innerText = '音效關';
      }
    }
  </script>

        task: "坐好挺胸，單腳向前平舉伸直小腿停留 3 秒，雙腳各做 4 次！",
        grid: { row: 5, col: 2 }
      },
      {
        id: 14,
        city: "台東",
        food: "太麻里釋迦",
        icon: "🍈",
        type: "cognitive",
        task: "請說出台東一個知名的景點（例如知本溫泉、伯朗大道、三仙台等）！",
        grid: { row: 5, col: 1 }
      },
      {
        id: 15,
        city: "花蓮",
        food: "花蓮手工麻糬",
        icon: "🍡",
        type: "muscle",
        task: "像擣麻糬一樣，雙手握空拳由上往下輕輕拍捶大腿前側與外側放鬆 15 次！",
        grid: { row: 4, col: 1 }
      },
      {
        id: 16,
        city: "宜蘭",
        food: "三星蔥油餅",
        icon: "🧅",
        type: "cognitive",
        task: "青蔥是料理的好幫手！請說出 2 道一定要加蔥才好吃的家常菜！",
        grid: { row: 3, col: 1 }
      },
      {
        id: 17,
        city: "澎湖",
        food: "古早味黑糖糕",
        icon: "🧁",
        type: "muscle",
        task: "雙手向兩側水平展開像海鷗拍翅膀，緩慢向上拍動伸展肩關節 10 次！",
        grid: { row: 2, col: 1 }
      }
    ];

    // State Variables
    let currentTurn = 'red'; // 'red' or 'blue'
    let isRolling = false;
    const scores = { red: 0, blue: 0 };
    const positions = { red: 0, blue: 0 }; // 0 to 17
    let currentModalStation = null;
  </script>

  <script>
    // Render Board Grid
    function renderBoard() {
      const container = document.querySelector('.board-grid');
      
      boardStations.forEach((station) => {
        const tile = document.createElement('div');
        tile.id = `station-${station.id}`;
        tile.style.gridRowStart = station.grid.row;
        tile.style.gridColumnStart = station.grid.col;

        const isMuscle = station.type === 'muscle';
        const typeBadgeColor = isMuscle 
          ? 'bg-amber-100 text-amber-900 border-amber-300' 
          : 'bg-indigo-100 text-indigo-900 border-indigo-300';
        const typeName = isMuscle ? '💪 肌力' : '🧠 認知';

        tile.className = `bg-white rounded-2xl p-2 md:p-2.5 border-2 border-slate-200 shadow-sm flex flex-col justify-between items-center text-center relative hover:shadow-md transition-all cursor-pointer`;
        tile.onclick = () => openStationModal(station);

        tile.innerHTML = `
          <div class="w-full flex items-center justify-between text-[11px] font-black">
            <span class="px-1.5 py-0.5 rounded border ${typeBadgeColor}">${typeName}</span>
            <span class="text-slate-400 font-extrabold">#${station.id + 1}</span>
          </div>

          <div class="my-0.5">
            <div class="text-2xl md:text-3xl">${station.icon}</div>
            <div class="font-black text-sm md:text-base text-slate-800 leading-tight">${station.city}</div>
            <div class="text-xs font-extrabold text-emerald-700 truncate max-w-[85px] md:max-w-[115px]">${station.food}</div>
          </div>

          <div class="w-full flex justify-center items-center gap-1.5 min-h-[26px]" id="token-box-${station.id}">
          </div>
        `;

        container.appendChild(tile);
      });

      renderDiceFace(1);
      updateTokenPositions();
      updateTurnUI();
    }

    // Render Dice Face Pip Configuration
    function renderDiceFace(value) {
      const face = document.getElementById('diceFaceDisplay');
      face.innerHTML = '';

      const pipMap = {
        1: [{r:2, c:2, red: true}],
        2: [{r:1, c:1}, {r:3, c:3}],
        3: [{r:1, c:1}, {r:2, c:2}, {r:3, c:3}],
        4: [{r:1, c:1}, {r:1, c:3}, {r:3, c:1}, {r:3, c:3}],
        5: [{r:1, c:1}, {r:1, c:3}, {r:2, c:2}, {r:3, c:1}, {r:3, c:3}],
        6: [{r:1, c:1}, {r:2, c:1}, {r:3, c:1}, {r:1, c:3}, {r:2, c:3}, {r:3, c:3}]
      };

      const pips = pipMap[value] || pipMap[1];
      pips.forEach(p => {
        const dot = document.createElement('div');
        dot.className = `pip ${p.red ? 'pip-red' : ''}`;
        dot.style.gridRowStart = p.r;
        dot.style.gridColumnStart = p.c;
        face.appendChild(dot);
      });
    }

    // Update tokens on the board
    function updateTokenPositions() {
      for (let i = 0; i < boardStations.length; i++) {
        const box = document.getElementById(`token-box-${i}`);
        if (box) box.innerHTML = '';
        const tile = document.getElementById(`station-${i}`);
        if (tile) tile.classList.remove('tile-highlight');
      }

      // Red Token
      const redBox = document.getElementById(`token-box-${positions.red}`);
      if (redBox) {
        const redPiece = document.createElement('div');
        redPiece.className = 'w-6 h-6 md:w-7 md:h-7 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-black shadow-md border-2 border-white token-floating';
        redPiece.title = '紅隊位置';
        redPiece.innerHTML = '🍎';
        redBox.appendChild(redPiece);
      }

      // Blue Token
      const blueBox = document.getElementById(`token-box-${positions.blue}`);
      if (blueBox) {
        const bluePiece = document.createElement('div');
        bluePiece.className = 'w-6 h-6 md:w-7 md:h-7 rounded-full bg-sky-500 text-white flex items-center justify-center text-xs font-black shadow-md border-2 border-white token-floating';
        bluePiece.title = '藍隊位置';
        bluePiece.innerHTML = '🚙';
        blueBox.appendChild(bluePiece);
      }

      // Highlight active team tile
      const activeIdx = positions[currentTurn];
      const activeTile = document.getElementById(`station-${activeIdx}`);
      if (activeTile) {
        activeTile.classList.add('tile-highlight');
      }

      // Update location indicator
      document.getElementById('redLocationText').innerText = 
        `第${positions.red + 1}站 ${boardStations[positions.red].city} (${boardStations[positions.red].food})`;
      document.getElementById('blueLocationText').innerText = 
        `第${positions.blue + 1}站 ${boardStations[positions.blue].city} (${boardStations[positions.blue].food})`;
    }

    // Update Turn Header & Banner UI
    function updateTurnUI() {
      const isRed = currentTurn === 'red';
      const redName = document.getElementById('redTeamName').value || '吉祥紅隊';
      const blueName = document.getElementById('blueTeamName').value || '如意藍隊';

      const redCard = document.getElementById('redTeamCard');
      const blueCard = document.getElementById('blueTeamCard');
      const redBadge = document.getElementById('redBadge');
      const blueBadge = document.getElementById('blueBadge');

      if (isRed) {
        redCard.classList.add('border-rose-500', 'bg-rose-50/60', 'scale-[1.02]');
        redCard.classList.remove('border-slate-200');
        redBadge.classList.remove('hidden');

        blueCard.classList.remove('border-sky-500', 'bg-sky-50/60', 'scale-[1.02]');
        blueCard.classList.add('border-slate-200');
        blueBadge.classList.add('hidden');

        document.getElementById('turnBanner').innerHTML = `🍎 ${redName} 請擲骰`;
        document.getElementById('centerCurrentTeamSpan').innerText = redName;
        document.getElementById('centerCurrentTeamSpan').className = 'text-rose-600 underline decoration-rose-300 underline-offset-4';
      } else {
        blueCard.classList.add('border-sky-500', 'bg-sky-50/60', 'scale-[1.02]');
        blueCard.classList.remove('border-slate-200');
        blueBadge.classList.remove('hidden');

        redCard.classList.remove('border-rose-500', 'bg-rose-50/60', 'scale-[1.02]');
        redCard.classList.add('border-slate-200');
        redBadge.classList.add('hidden');

        document.getElementById('turnBanner').innerHTML = `🚙 ${blueName} 請擲骰`;
        document.getElementById('centerCurrentTeamSpan').innerText = blueName;
        document.getElementById('centerCurrentTeamSpan').className = 'text-sky-600 underline decoration-sky-300 underline-offset-4';
      }
    }
  </script>

  <script>
    // Independent Random Integer 1 to 6
    function getRandomDiceRoll() {
      if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return (arr[0] % 6) + 1;
      }
      return Math.floor(Math.random() * 6) + 1;
    }

    // Roll Dice Action
    function rollDiceAction() {
      if (isRolling) return;
      isRolling = true;
      initAudio();

      const btn = document.getElementById('rollDiceBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      const cube = document.getElementById('diceCube');
      const tip = document.getElementById('diceTipText');
      const activeTeamName = currentTurn === 'red' 
        ? (document.getElementById('redTeamName').value || '紅隊') 
        : (document.getElementById('blueTeamName').value || '藍隊');

      // True random integer from 1 to 6
      const finalSteps = getRandomDiceRoll();

      let rollTicks = 0;
      const totalTicks = 12;

      const rollTimer = setInterval(() => {
        rollTicks++;
        playDiceTick();

        // 3D tumble animation
        const randX = Math.floor(Math.random() * 360);
        const randY = Math.floor(Math.random() * 360);
        cube.style.transform = `rotateX(${randX}deg) rotateY(${randY}deg)`;

        // Pip preview while rolling
        const tempFace = Math.floor(Math.random() * 6) + 1;
        renderDiceFace(tempFace);
        tip.innerText = `🎲 ${activeTeamName} 骰子旋轉中...`;

        if (rollTicks >= totalTicks) {
          clearInterval(rollTimer);
          cube.style.transform = `rotateX(0deg) rotateY(0deg)`;
          renderDiceFace(finalSteps);

          tip.innerText = `✨ ${activeTeamName} 擲出了【 ${finalSteps} 點 】！出發！`;
          playTone(560, 0.2, 'triangle');

          setTimeout(() => {
            stepByStepMovement(finalSteps, 1);
          }, 450);
        }
      }, 90);
    }

    // Step-by-step token hopping
    function stepByStepMovement(remainingSteps, currentStepCount) {
      if (remainingSteps <= 0) {
        isRolling = false;
        const btn = document.getElementById('rollDiceBtn');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');

        const activeIndex = positions[currentTurn];
        currentModalStation = boardStations[activeIndex];

        playTone(680, 0.25, 'triangle');
        setTimeout(() => {
          openStationModal(currentModalStation);
        }, 400);
        return;
      }

      positions[currentTurn] = (positions[currentTurn] + 1) % boardStations.length;
      playHopStep(currentStepCount);
      updateTokenPositions();

      setTimeout(() => {
        stepByStepMovement(remainingSteps - 1, currentStepCount + 1);
      }, 350);
    }

    // Open Modal: Displays pure question, completely without teacher tips/hints
    function openStationModal(station) {
      currentModalStation = station;
      const modal = document.getElementById('taskModal');
      const content = document.getElementById('taskModalContent');
      const isMuscle = station.type === 'muscle';

      const headerBg = document.getElementById('taskHeaderBg');
      const typeBadge = document.getElementById('taskTypeBadge');
      const typeIcon = document.getElementById('taskTypeIcon');
      const headerEmoji = document.getElementById('taskHeaderEmoji');
      const modalTeamTag = document.getElementById('modalTeamTag');

      const teamName = currentTurn === 'red'
        ? (document.getElementById('redTeamName').value || '紅隊')
        : (document.getElementById('blueTeamName').value || '藍隊');

      modalTeamTag.innerText = `${teamName} 挑戰中`;
      headerEmoji.innerText = station.icon;

      if (isMuscle) {
        headerBg.className = 'p-6 md:p-8 text-white flex items-center justify-between bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600';
        typeBadge.innerText = '💪 肌力挑戰';
        typeIcon.innerText = '💪';
      } else {
        headerBg.className = 'p-6 md:p-8 text-white flex items-center justify-between bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-700';
        typeBadge.innerText = '🧠 認知挑戰';
        typeIcon.innerText = '🧠';
      }

      document.getElementById('taskCityTitle').innerText = `${station.city}・${station.food}`;
      document.getElementById('taskQuestionText').innerText = station.task;

      modal.classList.remove('hidden');
      setTimeout(() => {
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 20);
    }

    function openCurrentStationModal() {
      const activeIdx = positions[currentTurn];
      openStationModal(boardStations[activeIdx]);
    }
  </script>

  <script>
    // Award score points
    function awardScore(points) {
      scores[currentTurn] += points;
      document.getElementById(`${currentTurn}Score`).innerText = scores[currentTurn];
      
      playSuccessChime();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 75,
          spread: 80,
          origin: { y: 0.6 }
        });
      }

      closeTaskModal();
      nextTurn();
    }

    // Prompt custom score input
    function promptCustomScore() {
      const input = prompt("請輸入給長輩的自訂得分（數字）：", "15");
      if (input !== null) {
        const val = parseInt(input, 10);
        if (!isNaN(val)) {
          awardScore(val);
        }
      }
    }

    // Skip and pass turn without points
    function skipAndNext() {
      closeTaskModal();
      nextTurn();
    }

    function closeTaskModal() {
      const modal = document.getElementById('taskModal');
      const content = document.getElementById('taskModalContent');
      content.classList.add('scale-95');
      content.classList.remove('scale-100');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 150);
    }

    // Pass turn to the other team
    function nextTurn() {
      currentTurn = (currentTurn === 'red') ? 'blue' : 'red';
      updateTurnUI();
      updateTokenPositions();

      const teamName = currentTurn === 'red' 
        ? (document.getElementById('redTeamName').value || '吉祥紅隊') 
        : (document.getElementById('blueTeamName').value || '如意藍隊');

      document.getElementById('centerStatusSubtitle').innerText = '回合交棒';
      document.getElementById('centerStatusTitle').innerHTML = 
        `換 <span class="${currentTurn === 'red' ? 'text-rose-600' : 'text-sky-600'} underline">${teamName}</span> 長輩擲骰！`;
      document.getElementById('diceTipText').innerText = `請 ${teamName} 的長輩代表點擊「按我擲骰子」！`;
    }

    // Cheering fanfare
    function triggerCheer() {
      playCheerFanfare();
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 90,
          origin: { y: 0.5 }
        });
      }
    }

    // Reset game logic
    function resetGame() {
      scores.red = 0;
      scores.blue = 0;
      positions.red = 0;
      positions.blue = 0;
      currentTurn = 'red';
      isRolling = false;

      document.getElementById('redScore').innerText = '0';
      document.getElementById('blueScore').innerText = '0';
      document.getElementById('diceTipText').innerText = '點擊擲骰子，隨機出現 1 ~ 6 步！';
      
      closeTaskModal();
      renderDiceFace(1);
      updateTokenPositions();
      updateTurnUI();
    }

    // Fullscreen presentation toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Initialize on window load
    window.addEventListener('DOMContentLoaded', () => {
      renderBoard();
      document.body.addEventListener('click', initAudio, { once: true });
    });
  </script>
</body>
</html>
